  <style>
/* ==========================================================
   Speeding Ticket KC — design tokens + styles
   Simple, trustworthy. Cream parchment, deep navy ink, brass.
   ========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  /* surfaces */
  --bg:           #F4EEDF;   /* warm parchment cream */
  --bg-raised:   #FBF7EC;    /* lighter paper */
  --bg-deep:     #EAE3D0;    /* slight sink */
  --bg-ink:      #14213D;    /* dark mode reverse panels */

  /* ink */
  --ink:         #1A2238;    /* near-black, navy-warm */
  --ink-soft:    #2E3650;
  --ink-muted:   #6B7080;
  --ink-faint:   #9CA0AE;

  /* brand */
  --navy:        #14213D;    /* primary brand */
  --navy-dark:   #0E1A33;
  --navy-soft:   #2C3858;

  /* accents */
  --brass:       #A8843C;    /* warm gold/brass — sparse */
  --brass-dark:  #8C6B2A;
  --ember:       #B23A28;    /* alerts / "stop" */
  --moss:        #3D6650;    /* positive */

  /* rules / borders */
  --rule:        #D4CCB6;
  --rule-soft:   #E0D9C5;
  --rule-ink:    #2C3858;

  /* type */
  --serif:       'Source Serif 4', 'Iowan Old Style', Georgia, serif;
  --sans:        'IBM Plex Sans', system-ui, sans-serif;
  --mono:        'IBM Plex Mono', ui-monospace, Menlo, monospace;

  /* scale */
  --t-12: 0.75rem;
  --t-13: 0.8125rem;
  --t-14: 0.875rem;
  --t-15: 0.9375rem;
  --t-16: 1rem;
  --t-18: 1.125rem;
  --t-20: 1.25rem;
  --t-22: 1.375rem;
  --t-24: 1.5rem;
  --t-28: 1.75rem;
  --t-32: 2rem;
  --t-40: 2.5rem;
  --t-48: 3rem;
  --t-56: 3.5rem;
  --t-72: 4.5rem;

  /* spacing */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;
  --s-10: 128px;

  /* misc */
  --r-sm: 2px;
  --r-md: 4px;
  --r-lg: 6px;
  --track-label: 0.12em;
  --track-wordmark: -0.005em;
  --dur: 150ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--t-16);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { display: block; max-width: 100%; }
[data-screen-label] { min-height: 1px; }

/* ---------- typography defaults ---------- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--serif);
  font-weight: 700;
  color: var(--ink);
  margin: 0;
  line-height: 1.1;
  letter-spacing: -0.012em;
  text-wrap: balance;
}
p { margin: 0; text-wrap: pretty; }
a { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; transition: color var(--dur) var(--ease); }
a:hover { color: var(--brass-dark); }
a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 2px; }
::selection { background: var(--navy); color: var(--bg); }

/* ---------- layout primitives ---------- */
.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 56px;
}
.container-narrow {
  max-width: 980px;
  margin: 0 auto;
  padding: 0 56px;
}
@media (max-width: 720px) {
  .container, .container-narrow { padding: 0 22px; }
}

.section {
  padding: 112px 0;
  border-bottom: 1px solid var(--rule);
}
.section.tight { padding: 72px 0; }
.section.compact { padding: 56px 0; }
.section.flush { padding-top: 0; }
@media (max-width: 720px) {
  .section { padding: 64px 0; }
}

/* ---------- eyebrow / small labels ---------- */
.eyebrow {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.eyebrow .num {
  font-family: var(--mono);
  color: var(--brass);
  font-weight: 500;
  letter-spacing: 0.04em;
}
.eyebrow .line {
  display: inline-block;
  width: 28px;
  height: 1px;
  background: var(--brass);
}

/* ---------- display headings ---------- */
.h-display {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(40px, 5.6vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.018em;
  color: var(--ink);
  text-wrap: balance;
}
.h-display em {
  font-style: normal;
  color: var(--navy);
}
.h-section {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(30px, 3.4vw, 44px);
  line-height: 1.08;
  letter-spacing: -0.012em;
  text-wrap: balance;
}
.h-card {
  font-family: var(--serif);
  font-weight: 700;
  font-size: var(--t-22);
  line-height: 1.2;
  letter-spacing: -0.005em;
}
.lede {
  font-size: var(--t-18);
  line-height: 1.55;
  color: var(--ink-soft);
  max-width: 60ch;
}
.muted { color: var(--ink-muted); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 22px;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 500;
  line-height: 1;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease), opacity var(--dur) var(--ease);
  white-space: nowrap;
}
.btn:active { opacity: 0.92; }
.btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.btn-primary {
  background: var(--navy);
  color: var(--bg);
}
.btn-primary:hover { background: var(--navy-dark); color: var(--bg); }
.btn-secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.btn-secondary:hover { background: var(--ink); color: var(--bg); }
.btn-ghost {
  background: transparent;
  color: var(--navy);
  padding: 14px 4px;
  border-radius: 0;
  border-bottom: 1px solid var(--navy);
}
.btn-ghost:hover { color: var(--brass-dark); border-color: var(--brass-dark); }
.btn-brass {
  background: var(--brass);
  color: #1a1306;
}
.btn-brass:hover { background: var(--brass-dark); color: var(--bg); }
.btn-lg { padding: 18px 28px; font-size: 16px; }
.btn-sm { padding: 10px 16px; font-size: 13px; }
.btn-block { width: 100%; }

/* ---------- alert/urgent top bar ---------- */
.urgent-bar {
  background: var(--navy);
  color: var(--bg);
  font-size: 13px;
}
.urgent-bar-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 9px 56px;
  display: flex;
  gap: 24px;
  align-items: center;
  justify-content: space-between;
}
.urgent-bar-inner .left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.urgent-bar-inner .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--brass);
  display: inline-block;
}
.urgent-bar-inner a {
  color: var(--bg);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}
.urgent-bar-inner a:hover { color: var(--brass); }
.urgent-bar-inner .right {
  display: flex;
  gap: 24px;
  align-items: center;
}
@media (max-width: 720px) {
  .urgent-bar-inner { padding: 8px 20px; font-size: 12px; gap: 12px; }
  .urgent-bar-inner .hide-sm { display: none; }
}

/* ---------- nav ---------- */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid transparent;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.nav.scrolled {
  border-bottom-color: var(--rule);
  background: rgba(244, 238, 223, 0.94);
  backdrop-filter: saturate(120%) blur(6px);
}
.nav-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 18px 56px;
  display: flex;
  align-items: center;
  gap: 36px;
}
.brand {
  text-decoration: none;
  display: inline-flex;
  align-items: baseline;
  gap: 2px;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.brand .stkc { color: var(--ink); }
.brand .kc { color: var(--brass); }
.brand .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brass); margin: 0 4px 6px; align-self: end; }
.brand-stack {
  display: flex;
  flex-direction: column;
  gap: 0;
  text-decoration: none;
}
.brand-stack .top {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.008em;
  color: var(--ink);
  line-height: 1;
}
.brand-stack .sub {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 4px;
}

.nav-links {
  display: flex;
  gap: 24px;
  margin-left: 8px;
}
.nav-links a {
  font-size: 14px;
  color: var(--ink-soft);
  text-decoration: none;
  font-weight: 500;
  padding: 6px 0;
  border-bottom: 1px solid transparent;
  white-space: nowrap;
}
.nav-links a:hover, .nav-links a.active {
  color: var(--ink);
  border-bottom-color: var(--brass);
}
.nav-right {
  margin-left: auto;
  display: flex;
  gap: 16px;
  align-items: center;
}
.nav-phone {
  font-family: var(--mono);
  color: var(--ink);
  text-decoration: none;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  white-space: nowrap;
}
.nav-phone:hover { color: var(--brass-dark); }
.nav-right .btn { white-space: nowrap; }
@media (max-width: 1100px) {
  .nav-phone .num { display: none; }
}
@media (max-width: 1080px) {
  .nav-links { display: none; }
  .nav-inner { padding: 16px 22px; gap: 16px; }
}

/* ---------- hero ---------- */
.hero {
  padding: 88px 0 96px;
  border-bottom: 1px solid var(--rule);
  position: relative;
  overflow: hidden;
}
.hero::before {
  /* subtle decorative seal placement bottom-right */
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0; width: 36%;
  background:
    radial-gradient(circle at 70% 30%, rgba(168,132,60,0.06), transparent 60%);
  pointer-events: none;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.18fr 0.82fr;
  gap: 72px;
  align-items: start;
  position: relative;
}
@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; gap: 48px; }
  .hero { padding: 56px 0 64px; }
}

.hero-rating {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 9px 14px;
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  background: var(--bg-raised);
  font-size: 13px;
  margin-bottom: 28px;
}
.hero-rating .stars { color: var(--brass); letter-spacing: 1px; font-size: 14px; }
.hero-rating .count {
  font-family: var(--mono);
  font-weight: 500;
  color: var(--ink);
}
.hero-rating .src {
  color: var(--ink-muted);
  border-left: 1px solid var(--rule);
  padding-left: 12px;
  margin-left: 2px;
}

.hero h1 .price {
  font-family: var(--mono);
  color: var(--brass);
  font-weight: 500;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.hero h1 .underline-link {
  text-decoration: underline;
  text-decoration-color: var(--brass);
  text-decoration-thickness: 2px;
  text-underline-offset: 8px;
}

.hero-sub {
  font-size: var(--t-20);
  line-height: 1.55;
  color: var(--ink-soft);
  margin-top: 28px;
  max-width: 56ch;
}
.hero-actions {
  display: flex;
  gap: 16px;
  margin-top: 36px;
  flex-wrap: wrap;
  align-items: center;
}

.hero-meta {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  margin-top: 56px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.hero-meta .item {
  padding: 22px 24px 22px 0;
  border-right: 1px solid var(--rule);
}
.hero-meta .item:last-child { border-right: 0; padding-right: 0; }
.hero-meta .item:not(:first-child) { padding-left: 24px; }
.hero-meta .v {
  font-family: var(--mono);
  color: var(--ink);
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.015em;
  line-height: 1;
}
.hero-meta .v .accent { color: var(--brass); }
.hero-meta .k {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: var(--track-label);
  color: var(--ink-muted);
  margin-top: 8px;
  font-weight: 600;
}
@media (max-width: 640px) {
  .hero-meta { grid-template-columns: 1fr; }
  .hero-meta .item { border-right: 0; border-bottom: 1px solid var(--rule); padding: 16px 0; }
  .hero-meta .item:not(:first-child) { padding-left: 0; }
  .hero-meta .item:last-child { border-bottom: 0; }
}

/* ---------- contact card (form) ---------- */
.contact-card {
  background: var(--bg-raised);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: 28px 28px 24px;
  position: relative;
}
.contact-card .corner {
  position: absolute;
  top: -12px;
  left: 24px;
  background: var(--brass);
  color: #1a1306;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: var(--r-sm);
}
.contact-card h3 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: var(--t-24);
  margin: 4px 0 6px;
  color: var(--ink);
}
.contact-card .sub {
  color: var(--ink-muted);
  font-size: 13px;
  margin: 0 0 22px;
  line-height: 1.5;
}

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.02em;
}
.field label .req { color: var(--brass); }
.field input,
.field textarea,
.field select {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  padding: 11px 12px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.4;
  width: 100%;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.field input:focus,
.field textarea:focus,
.field select:focus {
  outline: none;
  border-color: var(--navy);
  background: var(--bg-raised);
  box-shadow: 0 0 0 3px rgba(20, 33, 61, 0.12);
}
.field textarea { resize: vertical; min-height: 76px; }
.field input.invalid,
.field textarea.invalid { border-color: var(--ember); }
.field .err { font-size: 11px; color: var(--ember); min-height: 14px; line-height: 1.3; }
.disclaimer {
  font-size: 11px;
  color: var(--ink-muted);
  line-height: 1.55;
  margin-top: 14px;
}
.contact-card .or {
  text-align: center;
  font-size: 11px;
  color: var(--ink-muted);
  margin: 16px 0 10px;
  text-transform: uppercase;
  letter-spacing: var(--track-label);
  position: relative;
}
.contact-card .or::before,
.contact-card .or::after {
  content: '';
  position: absolute;
  top: 50%;
  width: calc(50% - 22px);
  height: 1px;
  background: var(--rule);
}
.contact-card .or::before { left: 0; }
.contact-card .or::after { right: 0; }

.contact-card .call {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 19px;
  color: var(--ink);
  text-decoration: none;
  padding: 12px;
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  background: var(--bg);
  font-weight: 500;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.contact-card .call:hover { border-color: var(--navy); background: var(--bg-raised); }
.contact-card .call .ico { color: var(--brass); }

.form-success {
  text-align: center;
  padding: 36px 8px 24px;
}
.form-success .check {
  width: 60px; height: 60px; border-radius: 50%;
  border: 1.5px solid var(--moss);
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
  color: var(--moss);
}
.form-success h4 {
  font-family: var(--serif);
  font-size: 22px;
  margin: 0 0 8px;
}
.form-success p { font-size: 14px; color: var(--ink-muted); margin: 0 auto; max-width: 36ch; }

/* ---------- services strip ---------- */
.services {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  background: var(--bg-raised);
}
.service {
  padding: 36px 28px;
  border-right: 1px solid var(--rule);
  text-decoration: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 230px;
  background: var(--bg-raised);
  transition: background var(--dur) var(--ease);
  position: relative;
}
.service:last-child { border-right: 0; }
.service:hover { background: var(--bg); }
.service .ico {
  color: var(--navy);
  display: inline-flex;
  margin-bottom: 4px;
}
.service h3 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 20px;
  color: var(--ink);
  margin: 0;
  line-height: 1.2;
}
.service p {
  font-size: 14px;
  color: var(--ink-muted);
  margin: 0;
  line-height: 1.55;
}
.service .more {
  margin-top: auto;
  font-size: 13px;
  color: var(--navy);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: var(--brass);
}
@media (max-width: 980px) {
  .services { grid-template-columns: repeat(2, 1fr); }
  .service:nth-child(2) { border-right: 0; }
  .service:nth-child(1), .service:nth-child(2) { border-bottom: 1px solid var(--rule); }
  .service:nth-child(3) { border-right: 1px solid var(--rule); }
}
@media (max-width: 560px) {
  .services { grid-template-columns: 1fr; }
  .service { border-right: 0; border-bottom: 1px solid var(--rule); min-height: 0; }
  .service:last-child { border-bottom: 0; }
}

/* ---------- two col layout ---------- */
.two-col {
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
  gap: 88px;
  align-items: start;
}
@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; gap: 40px; }
}

/* ---------- process steps ---------- */
.steps {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--rule);
}
.step {
  display: grid;
  grid-template-columns: 96px 1fr auto;
  gap: 28px;
  padding: 28px 0;
  border-bottom: 1px solid var(--rule);
  align-items: start;
}
.step .n {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--brass);
  letter-spacing: 0.06em;
  font-weight: 500;
  text-transform: uppercase;
  padding-top: 6px;
}
.step .n strong {
  display: block;
  font-family: var(--serif);

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Sections.jsx"></script>
  <script type="text/babel" src="Sections2.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "brass",
      "ink": "navy",
      "bg": "paper",
      "showUrgentBar": false,
      "showPartnership": true
    }/*EDITMODE-END*/;

    const ACCENT_HEXES = { brass: '#A8843C', gold: '#C99B3A', oxblood: '#8E2A2A', forest: '#3D6650' };
    const INK_HEXES    = { navy: '#14213D', charcoal: '#1F2229', forest: '#1F3D2E', oxblood: '#4A1818' };
    const BG_HEXES     = { cream: '#F4EEDF', paper: '#F7F4EE', ivory: '#FAF7EE', stone: '#EDEAE2' };

    const resolveKey = (hexes, hex) =>
      Object.keys(hexes).find((k) => hexes[k] === hex) || Object.keys(hexes)[0];

    const App = () => {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        document.documentElement.dataset.accent = t.accent;
        document.documentElement.dataset.ink    = t.ink;
        document.documentElement.dataset.bg     = t.bg;
      }, [t.accent, t.ink, t.bg]);

      return (
        <>
          {t.showUrgentBar && <UrgentBar/>}
          <Nav/>
          <main id="main-content">
            <Hero/>
            <Services/>
            <Pricing/>
            <Process/>
            <Why/>
            <Attorneys/>
            <Reviews/>
            {t.showPartnership && <Partnership/>}
            <Locations/>
            <CTAStrip/>
          </main>
          <Footer/>

          <TweaksPanel title="Palette &amp; Options">
            <TweakSection label="Colors">
              <TweakColor
                label="Brand accent"
                value={ACCENT_HEXES[t.accent]}
                options={Object.values(ACCENT_HEXES)}
                onChange={(hex) => setTweak('accent', resolveKey(ACCENT_HEXES, hex))}
              />
              <TweakColor
                label="Ink / dark surfaces"
                value={INK_HEXES[t.ink]}
                options={Object.values(INK_HEXES)}
                onChange={(hex) => setTweak('ink', resolveKey(INK_HEXES, hex))}
              />
              <TweakColor
                label="Page background"
                value={BG_HEXES[t.bg]}
                options={Object.values(BG_HEXES)}
                onChange={(hex) => setTweak('bg', resolveKey(BG_HEXES, hex))}
              />
            </TweakSection>

            <TweakSection label="Sections">
              <TweakToggle
                label="Top urgency bar"
                value={t.showUrgentBar}
                onChange={(v) => setTweak('showUrgentBar', v)}
              />
              <TweakToggle
                label="KC Defense Counsel block"
                value={t.showPartnership}
                onChange={(v) => setTweak('showPartnership', v)}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
