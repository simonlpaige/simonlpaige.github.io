<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brookside Party Warehouse | KC's Year-Round Party &amp; Costume Store</title>
  <meta name="description" content="Brookside Party Warehouse — party supplies, balloons, helium fills, pinatas, cards, costumes year-round. Two floors of fun. 103 W 63rd St, Kansas City MO 64113." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Creepster&display=swap" rel="stylesheet">
  <style>
/* Brookside Party Warehouse — Brand stylesheet */

:root {
  /* Backgrounds */
  --cream: #FFF8EC;
  --cream-deep: #FDEFD2;
  --paper: #FFFDF7;

  /* Ink */
  --ink: #1B1A1F;
  --ink-soft: #3B3A40;
  --ink-mute: #6E6C75;
  --rule: #E8E1D1;

  /* Rainbow — used on balloons, confetti, accents only */
  --red: #E63946;
  --orange: #F4862A;
  --yellow: #F6C443;
  --green: #4FB477;
  --blue: #3A86E0;
  --pink: #E86A92;

  /* Spookier */
  --void: #07070A;
  --void-2: #131318;
  --blood: #C8102E;
  --bone: #EDE6D2;
  --acid: #B6FF3D;

  /* Type */
  --display: "Bricolage Grotesque", "Recoleta", Georgia, serif;
  --body: "DM Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;

  /* Radii / shadow */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-pill: 999px;
  --shadow-sm: 0 2px 0 rgba(27,26,31,0.08);
  --shadow-md: 0 6px 0 rgba(27,26,31,0.10);
  --shadow-lg: 0 14px 30px rgba(27,26,31,0.10), 0 3px 0 rgba(27,26,31,0.08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }

h1, h2, h3, h4 {
  font-family: var(--display);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}

h1 { font-size: clamp(48px, 7vw, 96px); line-height: 0.96; letter-spacing: -0.035em; }
h2 { font-size: clamp(32px, 4vw, 56px); line-height: 1.02; letter-spacing: -0.03em; }
h3 { font-size: clamp(22px, 2vw, 30px); line-height: 1.15; }
p  { margin: 0; text-wrap: pretty; }

.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

/* Layout */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.container {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px;
}

/* Confetti canvas */
.confetti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 60;
}

/* Top nav */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 248, 236, 0.86);
  backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  gap: 24px;
}
@media (max-width: 768px) {
  .nav-inner { padding: 14px 20px; }
}
.nav-links {
  display: flex;
  gap: 28px;
  align-items: center;
  font-weight: 500;
}
.nav-links a {
  position: relative;
  padding: 6px 2px;
  color: var(--ink-soft);
  cursor: pointer;
}
.nav-links a:hover { color: var(--ink); }
.nav-links a.active { color: var(--ink); }
.nav-links a.active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -2px;
  height: 3px;
  background: var(--red);
  border-radius: 2px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 22px;
  border-radius: var(--r-pill);
  font-family: var(--body);
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  cursor: pointer;
  border: 2px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 3px 0 var(--ink);
  transition: transform 120ms ease, box-shadow 120ms ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
.btn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }

.btn--primary { background: var(--red); color: var(--paper); }
.btn--yellow  { background: var(--yellow); color: var(--ink); }
.btn--ghost   { background: transparent; box-shadow: none; }
.btn--ghost:hover { background: rgba(27,26,31,0.06); box-shadow: none; transform: none; }

.btn--sm { padding: 9px 14px; font-size: 13px; box-shadow: 0 2px 0 var(--ink); }

/* Pill / chip */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: var(--r-pill);
  background: var(--paper);
  border: 1px solid var(--rule);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
}
.chip-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 0 3px rgba(230,57,70,0.18);
}

/* Cards */
.card {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: 24px;
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}

/* Hero */
.hero {
  position: relative;
  padding: 72px 0 80px;
  overflow: hidden;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 40px;
  align-items: center;
}
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; }
}
.hero h1 .word { display: inline-block; }
.hero h1 .pop {
  display: inline-block;
  position: relative;
  color: var(--red);
}
.hero h1 .pop::before {
  content: "";
  position: absolute;
  inset: -8px -10px;
  background: var(--yellow);
  border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%;
  z-index: -1;
  transform: rotate(-2deg);
}

.lede {
  font-size: 19px;
  color: var(--ink-soft);
  max-width: 52ch;
  margin-top: 22px;
}

/* Marquee */
.marquee {
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  background: var(--cream-deep);
  overflow: hidden;
  padding: 16px 0;
}
.marquee-track {
  display: flex;
  gap: 48px;
  white-space: nowrap;
  animation: marquee 38s linear infinite;
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;
  color: var(--ink);
}
.marquee-track span {
  display: inline-flex;
  align-items: center;
  gap: 14px;
}
.marquee-dot {
  width: 10px; height: 10px; border-radius: 50%;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* Section */
.section {
  padding: 90px 0;
  border-top: 1px solid var(--rule);
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 24px;
  margin-bottom: 48px;
  flex-wrap: wrap;
}
.section-head .eyebrow { margin-bottom: 12px; display: block; }

/* Categories grid */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 22px;
}
.cat {
  position: relative;
  border-radius: var(--r-lg);
  padding: 28px;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  overflow: hidden;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 200ms ease;
  cursor: pointer;
}
.cat:hover { transform: translateY(-4px) rotate(-0.4deg); }
.cat .num {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--ink-mute);
}
.cat h3 { font-size: 30px; }
.cat .arrow {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper);
  display: grid; place-items: center;
  margin-top: 18px;
}
.cat--featured {
  grid-column: span 8;
  background: var(--red);
  color: var(--paper);
}
.cat--featured .num { color: rgba(255,253,247,0.8); }
.cat--featured .arrow { background: var(--paper); color: var(--ink); }
.cat--small { grid-column: span 4; }
.cat--med   { grid-column: span 6; }

@media (max-width: 900px) {
  .cat--featured, .cat--small, .cat--med { grid-column: span 12; }
}

.cat-art {
  position: absolute;
  right: -10px; bottom: -10px;
  opacity: 0.95;
  pointer-events: none;
}

/* Graduation feature */
.feature {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  align-items: stretch;
  background: var(--cream-deep);
  border-radius: var(--r-lg);
  padding: 36px;
  border: 1px solid var(--rule);
}
@media (max-width: 900px) { .feature { grid-template-columns: 1fr; } }
.feature h2 { font-size: clamp(36px, 4.5vw, 64px); }
.feature ul { list-style: none; padding: 0; margin: 16px 0 0; }
.feature li {
  display: flex; gap: 12px; align-items: center;
  padding: 10px 0;
  border-bottom: 1px dashed rgba(27,26,31,0.18);
  font-size: 16px;
}
.feature li:last-child { border-bottom: 0; }
.feature li .bullet {
  width: 10px; height: 10px; border-radius: 50%;
  flex: none;
}

/* Testimonials */
.tlist {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}
@media (max-width: 900px) { .tlist { grid-template-columns: 1fr; } }
.t {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: 28px;
  position: relative;
}
.t-quote { font-family: var(--display); font-size: 22px; line-height: 1.25; }
.t-meta { display: flex; align-items: center; gap: 12px; margin-top: 22px; color: var(--ink-mute); font-size: 14px; }
.t-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--display); color: var(--paper); font-weight: 700;
}
.t-stars { color: var(--orange); margin-bottom: 14px; letter-spacing: 2px; }

/* Visit / store */
.visit {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 36px;
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--r-lg);
  padding: 48px;
  position: relative;
  overflow: hidden;
}
.visit > * { min-width: 0; }
@media (max-width: 900px) { .visit { grid-template-columns: 1fr; padding: 32px; } }
.visit h2 { color: var(--paper); }
.visit-rows { margin-top: 24px; display: grid; gap: 14px; }
.visit-row {
  display: flex; gap: 14px;
  padding: 14px 0;
  border-bottom: 1px dashed rgba(255,253,247,0.18);
}
.visit-row:last-child { border-bottom: 0; }
.visit-row .k {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,253,247,0.55);
  min-width: 110px;
}
.map {
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(135deg, #2A2930 0%, #1B1A1F 100%);
  position: relative;
  min-height: 280px;
  border: 1px solid rgba(255,253,247,0.12);
}
.map-card {
  background: rgba(255,253,247,0.06);
  border: 1px solid rgba(255,253,247,0.15);
  border-radius: 20px;
  padding: 32px;
  min-width: 0;
  align-self: start;
}

/* Spookier teaser */
.spookier {
  background: var(--void);
  color: var(--bone);
  border-radius: var(--r-lg);
  padding: 56px;
  position: relative;
  overflow: hidden;
  border: 1px solid #2A2A33;
}
.spookier h2 {
  color: var(--blood);
  font-family: "Creepster", "Bricolage Grotesque", serif;
  font-weight: 400;
  letter-spacing: 0.04em;
  font-size: clamp(48px, 6vw, 90px);
  text-shadow: 0 0 18px rgba(200,16,46,0.6), 2px 2px 0 #000;
}
.spookier-flicker { animation: flicker 4.4s infinite; }
@keyframes flicker {
  0%,18%,22%,25%,53%,57%,100% { opacity: 1; }
  20%,24%,55% { opacity: 0.45; }
}
.spookier .stripes {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    180deg,
    transparent 0 3px,
    rgba(255,255,255,0.025) 3px 4px
  );
  pointer-events: none;
}

/* Footer */
.footer {
  border-top: 1px solid var(--rule);
  padding: 56px 0 28px;
  background: var(--cream-deep);
  margin-top: 60px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 32px;
}
@media (max-width: 900px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
.footer h4 { font-size: 14px; font-family: var(--mono); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 14px; color: var(--ink-mute); font-weight: 500; }
.footer ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.footer a:hover { color: var(--red); }
.footer-bottom {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 28px; margin-top: 32px;
  border-top: 1px solid var(--rule);
  color: var(--ink-mute);
  font-size: 13px;
  flex-wrap: wrap;
  gap: 12px;
}

/* Style guide page bits */
.sg-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 16px;
}
@media (max-width: 900px) { .sg-grid { grid-template-columns: repeat(3, 1fr); } }
.swatch {
  aspect-ratio: 1;
  border-radius: var(--r-md);
  display: flex;
  align-items: end;
  padding: 12px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  border: 1px solid var(--rule);
}
.swatch--dark { color: var(--paper); }

.type-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  align-items: baseline;
  gap: 18px;
  padding: 22px 0;
  border-bottom: 1px dashed var(--rule);
}
.type-row .label { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); letter-spacing: 0.18em; text-transform: uppercase; }

.logo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
@media (max-width: 900px) { .logo-grid { grid-template-columns: 1fr; } }
.logo-tile {
  border-radius: var(--r-lg);
  padding: 36px;
  display: grid;
  place-items: center;
  min-height: 240px;
  border: 1px solid var(--rule);
}
.logo-tile.dark { background: var(--ink); border-color: var(--ink); }
.logo-tile.cream { background: var(--cream-deep); }
.logo-tile.red { background: var(--red); }

/* Voice */
.voice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 900px) { .voice-grid { grid-template-columns: 1fr; } }
.voice {
  border-radius: var(--r-lg);
  padding: 26px;
  border: 1px solid var(--rule);
  background: var(--paper);
}
.voice.we   { border-color: #BFE5CC; background: #F1FBF4; }
.voice.dont { border-color: #F5C6CB; background: #FDF1F2; }
.voice h4 { font-family: var(--display); font-size: 22px; margin-bottom: 12px; }
.voice ul { padding-left: 18px; margin: 0; }
.voice li { padding: 4px 0; }

/* Page header */
.page-head {
  padding: 60px 0 28px;
  border-bottom: 1px solid var(--rule);
}
.page-head .eyebrow { display: inline-block; margin-bottom: 16px; }

/* Spookier page */
.spookier-page {
  background: var(--void);
  color: var(--bone);
  min-height: 100vh;
}
.spookier-page .nav {
  background: rgba(7,7,10,0.85);
  border-bottom-color: #1F1F26;
}
.spookier-page .nav-links a { color: rgba(237,230,210,0.7); }
.spookier-page .nav-links a:hover { color: var(--bone); }
.spookier-page .nav-links a.active { color: var(--blood); }
.spookier-page .nav-links a.active::after { background: var(--blood); }

.tz-band {
  background: #000;
  color: var(--bone);
  font-family: "Creepster", serif;
  font-size: 18px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  padding: 12px 0;
  text-align: center;
  border-top: 2px solid var(--bone);
  border-bottom: 2px solid var(--bone);
}
.tz-band.red { background: var(--blood); color: #000; border-color: #000; }

.option-card {
  background: #11111A;
  border: 1px solid #25252F;
  border-radius: var(--r-lg);
  padding: 32px;
  position: relative;
  overflow: hidden;
}
.option-card.tz {
  background: #000;
  border-color: var(--bone);
}
.option-card.vhs {
  background: #1A0F1F;
  border-color: #4A1A4F;
}
.option-card.haunted {
  background: #0E0712;
  border-color: #3A1A2A;
}

.blood-drip {
  position: absolute;
  top: 0;
  width: 6px;
  background: var(--blood);
  border-radius: 0 0 50% 50%;
}

/* Contact */
.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
}
@media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr; } }

.input {
  width: 100%;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1.5px solid var(--rule);
  background: var(--paper);
  font-family: var(--body);
  font-size: 15px;
  color: var(--ink);
  margin-top: 6px;
}
.input:focus { outline: none; border-color: var(--ink); }
.label {
  display: block;
  font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-mute);
  margin-top: 16px;
}
textarea.input { min-height: 140px; resize: vertical; }

/* Drift balloons (decorative) */
@keyframes drift {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(2deg); }
}
.drift { animation: drift 5s ease-in-out infinite; }
.drift.d2 { animation-duration: 7s; animation-delay: -2s; }
.drift.d3 { animation-duration: 6s; animation-delay: -1s; }

/* Util */
.hidden { display: none !important; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--ink-mute); }
.hr { height: 1px; background: var(--rule); border: 0; margin: 28px 0; }

/* Confetti placeholder visual (for static state) */
.confetti-static {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 12% 22%, var(--red) 0 4px, transparent 5px),
    radial-gradient(circle at 88% 18%, var(--yellow) 0 4px, transparent 5px),
    radial-gradient(circle at 24% 78%, var(--green) 0 4px, transparent 5px),
    radial-gradient(circle at 76% 84%, var(--blue) 0 4px, transparent 5px),
    radial-gradient(circle at 52% 14%, var(--pink) 0 3px, transparent 4px);
  pointer-events: none;
  opacity: 0.5;
}

  <script>
// Confetti — burst on load + retrigger on hover/click
// Lightweight canvas particle engine

(function() {
  const COLORS = ["#E63946", "#F4862A", "#F6C443", "#4FB477", "#3A86E0", "#E86A92"];

  class ConfettiEngine {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext("2d");
      this.particles = [];
      this.running = false;
      this.intensity = 1; // 0.5..2
      this.resize();
      window.addEventListener("resize", () => this.resize());
      this.loop = this.loop.bind(this);
    }
    resize() {
      const dpr = window.devicePixelRatio || 1;
      this.canvas.width = window.innerWidth * dpr;
      this.canvas.height = window.innerHeight * dpr;
      this.canvas.style.width = window.innerWidth + "px";
      this.canvas.style.height = window.innerHeight + "px";
      this.ctx.scale(dpr, dpr);
    }
    spawn(x, y, count = 80, opts = {}) {
      const n = Math.round(count * this.intensity);
      for (let i = 0; i < n; i++) {
        const angle = opts.angle != null ? opts.angle + (Math.random() - 0.5) * (opts.spread || Math.PI) : Math.random() * Math.PI * 2;
        const speed = (opts.speedMin || 6) + Math.random() * (opts.speedMax || 10);
        this.particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (opts.lift || 4),
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          size: 5 + Math.random() * 7,
          shape: Math.random() < 0.5 ? "rect" : (Math.random() < 0.5 ? "circle" : "ribbon"),
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.3,
          life: 1,
          decay: 0.004 + Math.random() * 0.006,
          gravity: 0.18 + Math.random() * 0.08,
          drag: 0.985,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.05 + Math.random() * 0.08,
        });
      }
      this.start();
    }
    burst(x, y) {
      // Cannons from bottom-left and bottom-right
      const W = window.innerWidth;
      const H = window.innerHeight;
      this.spawn(0, H - 20, 100, { angle: -Math.PI / 3, spread: Math.PI / 3.4, speedMin: 12, speedMax: 22, lift: 6 });
      this.spawn(W, H - 20, 100, { angle: -2 * Math.PI / 3, spread: Math.PI / 3.4, speedMin: 12, speedMax: 22, lift: 6 });
      this.spawn(W / 2, H * 0.65, 60, { speedMin: 4, speedMax: 9, lift: 3 });
    }
    pop(x, y) {
      this.spawn(x, y, 40, { speedMin: 3, speedMax: 8, lift: 2 });
    }
    start() {
      if (this.running) return;
      this.running = true;
      requestAnimationFrame(this.loop);
    }
    loop() {
      const ctx = this.ctx;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.vy += p.gravity;
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.wobble += p.wobbleSpeed;
        p.x += p.vx + Math.sin(p.wobble) * 0.6;
        p.y += p.vy;
        p.rot += p.vr;
        p.life -= p.decay;
        if (p.life <= 0 || p.y > window.innerHeight + 40) {
          this.particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.shape === "rect") {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
        } else if (p.shape === "circle") {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // ribbon
          ctx.fillRect(-p.size / 2, -1.5, p.size, 3);
        }
        ctx.restore();
      }
      if (this.particles.length > 0) {
        requestAnimationFrame(this.loop);
      } else {
        this.running = false;
      }
    }
  }

  // Singleton
  let engine = null;
  function getEngine() {
    if (engine) return engine;
    let canvas = document.getElementById("__confetti");
    if (!canvas) {
      canvas = document.createElement("canvas");
      canvas.id = "__confetti";
      canvas.className = "confetti-canvas";
      document.body.appendChild(canvas);
    }
    engine = new ConfettiEngine(canvas);
    return engine;
  }

  window.Confetti = {
    burst: () => getEngine().burst(),
    pop: (x, y) => getEngine().pop(x, y),
    setIntensity: (v) => { getEngine().intensity = v; },
    spawnAt: (x, y, count, opts) => getEngine().spawn(x, y, count, opts),
  };
})();

  </script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = {
      "featured": "graduation",
      "confettiIntensity": 2.5,
      "vibe": "playful"
    };

    function App() {
      const [page, setPage] = React.useState("home");
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const burstedRef = React.useRef(false);

      React.useEffect(() => {
        if (window.Confetti) window.Confetti.setIntensity(tweaks.confettiIntensity);
      }, [tweaks.confettiIntensity]);

      React.useEffect(() => {
        if (burstedRef.current) return;
        burstedRef.current = true;
        const t = setTimeout(() => window.Confetti && window.Confetti.burst(), 300);
        return () => clearTimeout(t);
      }, []);

      React.useEffect(() => {
        if (page === "home") {
          const t = setTimeout(() => window.Confetti && window.Confetti.burst(), 200);
          return () => clearTimeout(t);
        }
      }, [page]);

      React.useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [page]);

      const isSpookier = page === "spookier";

      return (
        <div className="app" data-screen-label={page}>
          <Nav page={page} setPage={setPage} spookier={isSpookier} />
          {page === "home" && <HomePage featured={tweaks.featured} vibe={tweaks.vibe} />}
          {page === "shop" && <ShopPage />}
          {page === "spookier" && <SpookierPage />}
          {page === "style" && <StyleGuidePage />}
          {page === "contact" && <ContactPage />}

          <TweaksPanel title="Tweaks">
            <TweakSection title="Featured category">
              <TweakRadio
                value={tweaks.featured}
                onChange={(v) => setTweak("featured", v)}
                options={[
                  { value: "graduation", label: "Graduation" },
                  { value: "halloween", label: "Halloween" },
                  { value: "birthday", label: "Birthday" },
                ]}
              />
            </TweakSection>
            <TweakSection title="Confetti intensity">
              <TweakSlider
                value={tweaks.confettiIntensity}
                onChange={(v) => setTweak("confettiIntensity", v)}
                min={0.3} max={2.5} step={0.1}
                format={(v) => v.toFixed(1) + "x"}
              />
              <TweakButton onClick={() => window.Confetti.burst()}>Test burst</TweakButton>
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
