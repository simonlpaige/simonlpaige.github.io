<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="Contact Kaleigh White at Renewed Vision by phone or email, or save her contact card.">
  <link rel="canonical" href="https://simonlpaige.com/kw/">
  <meta property="og:title" content="Kaleigh White | Renewed Vision">
  <meta property="og:description" content="Call, email, or save Kaleigh White's contact information.">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://simonlpaige.com/kw/">
  <meta property="profile:first_name" content="Kaleigh">
  <meta property="profile:last_name" content="White">
  <meta name="twitter:card" content="summary">
  <title>Kaleigh White | Renewed Vision</title>
  <style>
    :root {
      --night: #08090b;
      --surface: #101217;
      --surface-raised: #171a20;
      --ink: #f8f8f5;
      --muted: #a9abb2;
      --line: #31343d;
      --orange: #ff6c1b;
      --orange-dark: #d84c00;
      --shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--night);
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(circle at 86% 8%, rgba(255, 108, 27, 0.18), transparent 30rem),
        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: auto, 32px 32px, 32px 32px;
      content: "";
      pointer-events: none;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
    }

    .skip-link {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      padding: 10px 14px;
      color: var(--night);
      background: var(--orange);
      font-weight: 800;
      text-decoration: none;
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .page {
      display: grid;
      min-height: 100vh;
      place-items: center;
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 32px 0;
    }

    .shell {
      width: 100%;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .accent {
      height: 7px;
      background: var(--orange);
    }

    .profile {
      position: relative;
      overflow: hidden;
      padding: 34px 34px 30px;
      isolation: isolate;
    }

    .profile::after {
      position: absolute;
      z-index: -1;
      top: 76px;
      right: -46px;
      width: 250px;
      height: 250px;
      border: 1px solid rgba(255, 108, 27, 0.38);
      border-radius: 50%;
      content: "";
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 54px;
    }

    .wordmark {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 750;
      letter-spacing: -0.035em;
    }

    .wordmark span {
      color: var(--orange);
    }

    .card-label {
      margin: 0;
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.69rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .identity {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--orange);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 580px;
      margin: 0;
      font-size: clamp(3.2rem, 11vw, 6.8rem);
      font-weight: 760;
      letter-spacing: -0.075em;
      line-height: 0.84;
    }

    .initials {
      display: grid;
      width: 132px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--orange);
      border-radius: 50%;
      color: var(--orange);
      background: rgba(255, 108, 27, 0.06);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.08em;
    }

    .contact-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 42px;
    }

    .contact-link {
      display: grid;
      min-height: 76px;
      gap: 4px;
      align-content: center;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-raised);
      text-decoration: none;
      transition: border-color 150ms ease, transform 150ms ease;
    }

    .contact-link span {
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .contact-link strong {
      overflow-wrap: anywhere;
      font-size: 0.96rem;
    }

    .contact-link:hover {
      border-color: var(--orange);
      transform: translateY(-2px);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 34px 34px;
    }

    .button {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      padding: 13px 18px;
      border: 1px solid var(--orange);
      border-radius: 14px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      color: var(--night);
      background: var(--orange);
    }

    .button-primary:hover {
      background: #ff8847;
      border-color: #ff8847;
    }

    .button-secondary {
      color: var(--ink);
      background: transparent;
    }

    .button-secondary:hover {
      background: var(--orange-dark);
      border-color: var(--orange-dark);
    }

    .status {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    .site-credit {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.74rem;
      text-align: center;
    }

    .site-credit a {
      text-underline-offset: 3px;
    }

    :focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 18px, 760px);
        padding: 9px 0 24px;
      }

      .card {
        border-radius: 22px;
      }

      .profile {
        padding: 26px 20px 24px;
      }

      .brand-row {
        margin-bottom: 42px;
      }

      .identity {
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: 14px;
      }

      h1 {
        font-size: clamp(3rem, 15vw, 4.7rem);
      }

      .initials {
        width: 88px;
        font-size: 1.5rem;
      }

      .profile::after {
        top: 92px;
        right: -70px;
        width: 190px;
        height: 190px;
      }

      .contact-list,
      .actions {
        grid-template-columns: 1fr;
      }

      .contact-list {
        margin-top: 34px;
      }

      .actions {
        padding: 0 20px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Kaleigh White",
    "url": "https://simonlpaige.com/kw/",
    "telephone": "+1-903-646-2107",
    "email": "mailto:Kaleigh.white@renewedvision.com",
    "worksFor": {
      "@type": "Organization",
      "name": "Renewed Vision",
      "url": "https://renewedvision.com/"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#contact-card">Skip to contact card</a>

  <main class="page" id="contact-card">
    <div class="shell">
      <article class="card" aria-labelledby="contact-name">
        <div class="accent" aria-hidden="true"></div>

        <section class="profile">
          <header class="brand-row">
            <p class="wordmark">Renewed<span>Vision</span></p>
            <p class="card-label">Business card</p>
          </header>

          <div class="identity">
            <div>
              <p class="eyebrow">Renewed Vision</p>
              <h1 id="contact-name">Kaleigh<br>White</h1>
            </div>
            <div class="initials" aria-hidden="true">KW</div>
          </div>

          <div class="contact-list" aria-label="Contact Kaleigh White">
            <a class="contact-link" href="tel:+19036462107">
              <span>Call or text</span>
              <strong>903.646.2107</strong>
            </a>
            <a class="contact-link" href="mailto:Kaleigh.white@renewedvision.com">
              <span>Email</span>
              <strong>Kaleigh.white@renewedvision.com</strong>
            </a>
            <a class="contact-link" href="https://renewedvision.com/" target="_blank" rel="noopener noreferrer">
              <span>Company</span>
              <strong>renewedvision.com</strong>
            </a>
          </div>
        </section>

        <div class="actions">
          <a class="button button-primary" href="kaleigh-white.vcf" download="Kaleigh-White.vcf">Save Kaleigh's contact</a>
          <button class="button button-secondary" id="share-card" type="button">Share this card</button>
        </div>
      </article>

      <p class="status" id="share-status" role="status" aria-live="polite"></p>
      <footer>
        <p class="site-credit">Designed in KCMO · <a href="https://simonlpaige.com" rel="noopener">simonlpaige.com</a></p>
      </footer>
    </div>
  </main>

  <script>
    const shareButton = document.getElementById('share-card');
    const shareStatus = document.getElementById('share-status');
    const cardUrl = 'https://simonlpaige.com/kw/';

    shareButton.addEventListener('click', async () => {
      try {
        if (navigator.share) {
          await navigator.share({
            title: 'Kaleigh White | Renewed Vision',
            text: 'Contact Kaleigh White at Renewed Vision.',
            url: cardUrl
          });
          shareStatus.textContent = 'Card shared.';
          return;
        }

        await navigator.clipboard.writeText(cardUrl);
        shareStatus.textContent = 'Link copied.';
      } catch (error) {
        if (error.name !== 'AbortError') {
          shareStatus.textContent = 'Copy this link: ' + cardUrl;
        }
      }
    });
  </script>
</body>
</html>
